# OpenCode CLI 2.x. The mise registry now resolves "opencode" to npm first;
# keep the standalone binary in the installs/opencode layout. aqua downloads
# 2.x from opencode.ai and the registry declares no publisher checksum.
[tool_alias]
opencode = "aqua:anomalyco/opencode"

[tools]
opencode = "2.2.1"
