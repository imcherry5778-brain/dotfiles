min_version = "2026.9.18"

# Repository runtime and operations. Global CLI inventory belongs to home/dot_config/mise.
[tools]
python = "3.12.15"
[tasks.plan]
description = "Show the setup plan without installing or applying anything"
run = "sh install.sh --plan"
run_windows = "pwsh -NoProfile -File install.ps1 -Mode Plan"

[tasks.check]
description = "Check repository boundaries and report local prerequisites"
run = "sh scripts/unix/check.sh"
run_windows = "pwsh -NoProfile -File scripts/windows/check.ps1"
