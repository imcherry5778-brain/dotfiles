name: Installation checks

on:
  push:
    branches: [main]
    paths: ['home/**', '.chezmoiroot', 'install.sh', 'install.ps1', 'mise.toml', 'scripts/**', 'tests/**', '.dockerignore', '.github/workflows/install.yml']
  pull_request:
    paths: ['home/**', '.chezmoiroot', 'install.sh', 'install.ps1', 'mise.toml', 'scripts/**', 'tests/**', '.dockerignore', '.github/workflows/install.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: ${{ matrix.name }} / cold install
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: fedora
            name: Fedora 44 / common baseline
            full: "0"
          - platform: fedora
            name: Fedora 44 / full AI and native desktop apps
            full: "1"
          - platform: ubuntu
            name: Ubuntu 26.04 / desktop CLI profile
            full: "0"
          - platform: ubuntu
            name: Ubuntu 26.04 / AI and native desktop apps
            full: "1"
          - platform: arch
            name: Arch Linux / AI and native desktop apps
            full: "1"
          - platform: opensuse-tumbleweed
            name: openSUSE Tumbleweed / AI and native desktop apps
            full: "1"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build clean distribution user environment
        run: docker build --pull --build-arg FULL_INSTALL=${{ matrix.full }} --file tests/containers/${{ matrix.platform }}.Dockerfile --tag dotfiles-install-test .
      - name: Install, apply, run applications and repeat
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: docker run --rm --env GITHUB_TOKEN dotfiles-install-test

  windows:
    name: Windows / native CLI install from PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: dotfiles source
      - name: Install and verify twice in the real disposable runner home
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '& "./dotfiles source/tests/windows-install.ps1"'

  macos:
    name: macOS ARM64 / actual installation
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: dotfiles source
      - name: Install and verify twice in the real disposable runner home
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sh "./dotfiles source/tests/macos-install.sh"
