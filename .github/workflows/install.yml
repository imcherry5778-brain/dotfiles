name: Installation checks

on:
  push:
    branches: [main]
    paths: ['home/**', '.chezmoiroot', 'install.sh', 'scripts/**', 'tests/**', '.dockerignore', '.github/workflows/install.yml']
  pull_request:
    paths: ['home/**', '.chezmoiroot', 'install.sh', 'scripts/**', 'tests/**', '.dockerignore', '.github/workflows/install.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: ${{ matrix.name }} / cold install
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: fedora
            name: Fedora 44 / common baseline
            full: "0"
          - platform: ubuntu
            name: Ubuntu 26.04 / desktop CLI profile
            full: "0"
          - platform: ubuntu
            name: Ubuntu 26.04 / AI and native desktop apps
            full: "1"
          - platform: arch
            name: Arch Linux / AI and native desktop apps
            full: "1"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build clean distribution user environment
        run: docker build --pull --build-arg FULL_INSTALL=${{ matrix.full }} --file tests/containers/${{ matrix.platform }}.Dockerfile --tag dotfiles-install-test .
      - name: Install, apply, run applications and repeat
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: docker run --rm --env GITHUB_TOKEN dotfiles-install-test
