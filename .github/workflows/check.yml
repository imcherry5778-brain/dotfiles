name: Foundation checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    name: Foundation / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Fetch checksum-pinned test binary
        run: |
          $binary = ./tests/fetch-chezmoi.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'dotfiles-tools')
          "CHEZMOI_BIN=$binary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify native scripts and isolated initialization
        run: ./tests/verify.ps1
      - name: Verify shared installer contracts without downloads
        run: python3 ./tests/verify-installers.py
      - name: Verify native desktop plan without installation
        run: ./install.ps1 -Mode DesktopPlan
      - name: Prepare Fedora source-test shell on the disposable runner
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh
      - name: Verify proposed Fedora configuration in an isolated destination
        if: runner.os == 'Linux'
        run: python3 ./tests/verify-fedora.py --chezmoi $env:CHEZMOI_BIN --gh (Get-Command gh).Source
      - name: Verify Ubuntu configuration in an isolated destination
        if: runner.os == 'Linux'
        run: |
          python3 ./tests/verify-desktop.py --chezmoi $env:CHEZMOI_BIN
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python3 ./tests/verify-desktop.py --chezmoi $env:CHEZMOI_BIN --platform arch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python3 ./tests/verify-desktop.py --chezmoi $env:CHEZMOI_BIN --platform opensuse-tumbleweed
